<svg xmlns="http://www.w3.org/2000/svg" width="114" height="114" viewBox="0 0 114 114">
  <!-- Log Out app icon, drawn in the iOS 6 icon style (the home screen adds the rounded corners and gloss) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a70"/>
      <stop offset=".5" stop-color="#e5352b"/>
      <stop offset="1" stop-color="#a8140e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation=".6" flood-color="#6b0b06" flood-opacity=".8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="114" height="114" fill="url(#bg)"/>
  <rect width="114" height="114" fill="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" filter="url(#emboss)">
    <path d="M40.5 36.5a27 27 0 1 0 33 0"/>
    <path d="M57 25v31"/>
  </g>
</svg>

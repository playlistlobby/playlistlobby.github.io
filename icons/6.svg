<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 114">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d70"/>
      <stop offset="0.5" stop-color="#e5322a"/>
      <stop offset="1" stop-color="#a50f0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3d9d6"/>
    </linearGradient>
    <filter id="emboss" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#5a0505" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="114" height="114" fill="url(#bg)"/>
  <rect width="114" height="114" fill="url(#glow)"/>
  <g filter="url(#emboss)">
    <path d="M57 17 C57 17 32 50 32 69 a25 25 0 0 0 50 0 C82 50 57 17 57 17 Z" fill="url(#drop)"/>
    <!-- a tint of red inside so it reads as a blood drop, not a water drop -->
    <path d="M57 27 C57 27 40 52 40 67 a17 17 0 0 0 34 0 C74 52 57 27 57 27 Z" fill="#d82222" opacity="0.92"/>
    <path d="M47 58 C44 63 43 67 43.4 71 C43.8 74 45 76 47 78 C45.6 73 46 66 51 56 Z" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>

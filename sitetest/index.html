<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#dce7f1">
<title>playlist.mag</title>
<link rel="stylesheet" href="home.css?v=11">
</head>
<body>

<main class="stage" id="stage">
  <div class="leaves" aria-hidden="true"><img src="assets/leaves.webp" alt="" draggable="false"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- the liquid-glass play button; after a tap it turns into the playlist note and moves left -->
  <button class="glass" id="glass" type="button" aria-label="Play">
    <span class="shape"><i class="sh"></i><i class="g"></i><i class="rim"></i></span>
    <!-- the iOS 6 app icon (the project app); it takes the logo's place while you hover any option. Per-option icons are in assets/icons (shop.webp, contact.webp) if they are wanted again -->
    <span class="appicon" aria-hidden="true">
      <img class="any" src="assets/icons/projects.webp" alt="" draggable="false">
    </span>
  </button>

  <nav class="menu" id="menu" aria-label="Main">
    <a class="gbtn" style="--i:0" href="projects/" data-app="projects" tabindex="-1">projects</a>
    <a class="gbtn" style="--i:1" href="shop/" data-app="shop" tabindex="-1">shop</a>
    <a class="gbtn" style="--i:2" href="contact/" data-app="contact" tabindex="-1">contact</a>
  </nav>
</main>

<script type="module" src="home.js?v=10"></script>
</body>
</html>

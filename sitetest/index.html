<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#dde3e8">
<link rel="icon" href="data:,">
<title>playlist.mag</title>
<link rel="preload" as="fetch" href="assets/shapes/play.svg" crossorigin>
<link rel="preload" as="fetch" href="assets/shapes/note.svg" crossorigin>
<link rel="preload" as="image" href="assets/icons/projects.webp" type="image/webp">
<link rel="preload" as="image" href="assets/icons/shop.webp?v=4" type="image/webp">
<link rel="preload" as="image" href="assets/icons/contact.webp?v=4" type="image/webp">
<link rel="preload" as="image" href="assets/person-still.webp" type="image/webp">
<link rel="preload" as="image" href="assets/wordmark.webp" type="image/webp">
<link rel="preload" as="image" href="assets/wordmark-rim.webp" type="image/webp">
<link rel="stylesheet" href="home.css?v=27">
<script src="slide.js?v=8"></script>
</head>
<body>

<main class="stage" id="stage">
  <div class="leaves" aria-hidden="true"><img src="assets/leaves.webp" alt="" draggable="false"></div>

  <div class="person" aria-hidden="true">
    <img class="still" src="assets/person-still.webp" alt="" draggable="false">
    <video id="vid" muted loop playsinline preload="auto" poster="assets/person-still.webp" hidden></video>
  </div>
  <div class="veil" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- the rest of the logo: the word next to the play glass (slides behind the glass and fades when the menu opens) -->
  <div class="wordmark" role="img" aria-label="playlist">
    <img class="wm-sh" src="assets/wordmark.webp" alt="" draggable="false">
    <i class="wm-g"></i>
    <img class="wm-rim" src="assets/wordmark-rim.webp" alt="" draggable="false">
  </div>

  <!-- the liquid-glass play button; after a tap it turns into the playlist note and moves left -->
  <button class="glass" id="glass" type="button" aria-label="Play">
    <span class="shape"><i class="sh"></i><i class="g"></i><i class="rim"></i></span>
    <!-- the iOS 6 app icon of the hovered option (projects, shop = cart, contact = phone); it takes the logo's place while you hover -->
    <span class="appicon" aria-hidden="true">
      <img data-i="projects" src="assets/icons/projects.webp" alt="" draggable="false">
      <img data-i="shop" src="assets/icons/shop.webp?v=4" alt="" draggable="false">
      <img data-i="contact" src="assets/icons/contact.webp?v=4" alt="" draggable="false">
    </span>
  </button>

  <nav class="menu" id="menu" aria-label="Main">
    <a class="gbtn" style="--i:0" href="projects/?v=3" data-app="projects" tabindex="-1">projects</a>
    <a class="gbtn" style="--i:1" href="shop/?v=3" data-app="shop" tabindex="-1">shop</a>
    <a class="gbtn" style="--i:2" href="contact/?v=3" data-app="contact" tabindex="-1">contact</a>
  </nav>
</main>

<script type="module" src="home.js?v=21"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#dce7f1">
<link rel="icon" href="data:,">
<title>admin · playlist.mag</title>
<link rel="stylesheet" href="admin.css?v=6">
</head>
<body>

<header class="banner">
  <a class="homebtn" href="../projects/" aria-label="View the projects page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.6 11.4h2.7V20h5v-5.6h3.4V20h5v-8.6h2.7Z" fill="#fff"/></svg></a>
  <h1>Site admin</h1>
  <div class="bar-right" id="barRight" hidden>
    <span class="dirty" id="dirty" hidden>Unsaved changes</span>
    <button class="btn" id="logout" type="button">Log out</button>
  </div>
</header>

<nav class="tabsbar" id="tabsbar" hidden aria-label="Admin sections">
  <button type="button" data-view="apps" class="on">Apps</button>
  <button type="button" data-view="shop">Shop</button>
  <button type="button" data-view="orders">Orders <b id="nOrd" hidden></b></button>
  <button type="button" data-view="inq">Inquiries <b id="nInq" hidden></b></button>
</nav>

<!-- login -->
<main class="login" id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <h2>Admin</h2>
    <p class="muted">Enter the admin password to edit the apps on the projects page.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="loginBtn">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</main>

<!-- the editor -->
<main class="admin" id="admin" hidden>
  <aside class="apps">
    <div class="apps-head"><h2>Apps</h2><button class="btn small" id="addApp" type="button">+ Add app</button></div>
    <ul id="appList" class="app-list"></ul>
    <p class="muted tiny">The order here is the order on the phone.</p>
  </aside>

  <section class="editor" id="editor"></section>
</main>

<!-- the shop -->
<main class="admin" id="shopAdmin" hidden>
  <aside class="apps">
    <div class="apps-head"><h2>Products</h2><button class="btn small" id="addProduct" type="button">+ Add product</button></div>
    <ul id="prodList" class="app-list"></ul>
    <div class="testbar" aria-label="Test products">
      <span class="muted tiny">For testing the wheel:</span>
      <button class="btn small ghost" id="addTest" type="button">+ Test tee</button>
      <button class="btn small ghost" id="addTest4" type="button">+4</button>
      <button class="btn small ghost" id="fillTest" type="button">Fill to 16</button>
      <button class="btn small ghost" id="delTests" type="button">Remove test tees</button>
    </div>
    <p class="muted tiny">The order here is the order on the shop wheel.</p>
  </aside>
  <section class="editor" id="prodEditor"></section>
</main>

<!-- orders and inquiries from the site -->
<main class="inbox" id="inbox" hidden>
  <div class="inbox-head"><h2 id="inboxTitle">Orders</h2><button class="btn small" id="inboxRefresh" type="button">Refresh</button></div>
  <p class="muted tiny" id="inboxNote"></p>
  <div id="inboxList" class="inbox-list"></div>
</main>

<footer class="savebar" id="saveBar" hidden>
  <span id="saveMsg" class="muted"></span>
  <button class="btn primary" id="save" type="button">Save and publish</button>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="admin.js?v=12"></script>
</body>
</html>

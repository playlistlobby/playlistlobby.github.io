<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#dce7f1">
<title>contact · playlist.mag</title>
<link rel="stylesheet" href="contact.css?v=7">
</head>
<body>

<header class="banner">
  <nav class="tabs" aria-label="Main">
    <a href="../projects/?v=3">projects</a>
    <a href="../shop/?v=3">shop</a>
    <a href="../contact/?v=3" aria-current="page">contact</a>
  </nav>
</header>

<!-- the bar sits alone in the middle of the page; messages appear above it and push it down -->
<main class="stack" id="stack" aria-label="Contact">
  <div class="log" id="log" role="log" aria-live="polite"></div>
  <form class="bar" id="bar" data-mode="email" novalidate>
    <input class="field" id="field" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email"
           placeholder="Your email" maxlength="100" aria-label="Your email">
    <button class="send" id="send" type="submit" disabled aria-label="Send"><span class="ico mail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17A1.5 1.5 0 0 1 22 7v10a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 17V7a1.5 1.5 0 0 1 1.5-1.5Z" fill="#fff"/><path d="m2.8 7.2 9.2 6.6 9.2-6.6" fill="none" stroke="#4b8ae6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="ico msg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c5.5 0 9.8 3.4 9.8 7.6s-4.300 7.600-9.800 7.600c-1 0-2-.1-2.900-.4-1.400 1.300-3.200 2.200-5.200 2.400.9-.9 1.500-2 1.700-3.200C3.200 15.600 2.200 13.300 2.200 10.800 2.200 6.600 6.500 3.200 12 3.200Z" fill="#fff"/></svg></span></button>
  </form>
</main>

<script type="module" src="contact.js?v=5"></script>
</body>
</html>

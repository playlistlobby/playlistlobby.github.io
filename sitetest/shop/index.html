<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#dce7f1">
<title>shop · playlist.mag</title>
<link rel="preload" as="image" href="assets/tee-playlist3.webp" type="image/webp">
<link rel="stylesheet" href="shop.css?v=15">
<script src="../slide.js?v=3"></script>
</head>
<body>

<header class="banner">
  <a class="homebtn" href="../" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.6 11.4h2.7V20h5v-5.6h3.4V20h5v-8.6h2.7Z" fill="#fff"/></svg></a>
  <nav class="tabs" aria-label="Main">
    <a href="../projects/?v=3">projects</a>
    <a href="../shop/?v=3" aria-current="page">shop</a>
    <a href="../contact/?v=3">contact</a>
  </nav>
</header>

<main class="wheel" id="wheel" aria-label="Shop">
  <h1 class="sr-only">shop</h1>
  <!-- the shirts are put on the ring by shop.js -->
</main>

<!-- the product page: the clicked shirt glides to the top (the hero), the page zooms out into view around it -->
<section class="product" id="product" hidden aria-hidden="true" aria-label="Product">
  <button class="pp-back" id="pp-back" type="button"><span aria-hidden="true">‹</span> shop</button>
  <div class="pp-inner">
    <div class="pp-hero"><img id="pp-hero-img" alt="Playlist tee" draggable="false"></div>
    <div class="pp-info" id="pp-info">
      <div class="pp-thumbs" id="pp-thumbs" hidden></div>
      <h2 id="pp-title">Playlist tee</h2>
      <p class="pp-price" id="pp-price">10.000 DKK</p>
      <p class="pp-blurb" id="pp-blurb"></p>

      <div id="pp-colors-wrap" hidden>
        <p class="pp-label">Colour <span class="pp-pick" id="pp-color-name"></span></p>
        <div class="swatches" id="pp-colors" role="group" aria-label="Colour"></div>
      </div>
      <div id="pp-sizes-wrap" hidden>
        <p class="pp-label">Size</p>
        <div class="sizes" id="pp-sizes" role="group" aria-label="Size"></div>
      </div>
      <p class="pp-left" id="pp-left" role="status"></p>

      <button class="gbtn pp-buy" id="pp-buy" type="button">Buy · <span id="pp-buy-price">10.000 DKK</span></button>

      <form class="pp-form" id="pp-form" hidden novalidate>
        <p class="pp-label">Delivery</p>
        <label>Full name<input name="name" type="text" maxlength="60" autocomplete="name" placeholder="Your name, as on the parcel"></label>
        <label>Email<input name="email" type="email" maxlength="100" autocomplete="email" placeholder="you@example.com"></label>
        <label>Phone number<input name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+45 12 34 56 78"></label>
        <label>Street and number<input name="street" type="text" maxlength="80" autocomplete="address-line1" placeholder="Street 12, 2. th"></label>
        <div class="row">
          <label>Postcode<input name="zip" type="text" maxlength="10" autocomplete="postal-code" placeholder="2100"></label>
          <label>City<input name="city" type="text" maxlength="50" autocomplete="address-level2" placeholder="København"></label>
        </div>
        <label>Country<input name="country" type="text" maxlength="40" autocomplete="country-name" value="Danmark"></label>
        <button class="gbtn pp-buy" type="submit">Send order request</button>
      </form>
      <p class="pp-note" id="pp-note" role="status"></p>
    </div>
  </div>
</section>

<!-- the photos of a product, full size: tap a photo on the product page -->
<div class="lb" id="lb" hidden aria-hidden="true" role="dialog" aria-label="Photos">
  <button class="lb-x" id="lb-x" type="button" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous photo">‹</button>
  <img id="lb-img" alt="" draggable="false">
  <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Next photo">›</button>
  <p class="lb-count" id="lb-count"></p>
</div>

<script type="module" src="shop.js?v=14"></script>
</body>
</html>
